services:
  postgres:
    image: postgres:17-alpine
    container_name: mukellef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mukellef
      POSTGRES_PASSWORD: mukellef_dev
      POSTGRES_DB: mukellef
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mukellef-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
