# Kurum entegrasyonu — anti-corruption layer (06 §1.3, §3). Kurum web servisi / robot, ham format ayrıştırma,
# yayımlanmış dile (contracts/) çevirme. Alan kuralı ve alan tablolarına yazma YOK.
[project]
name = "eworks-integration"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "import-linter>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eworks_integration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["feature(key): testi feature-registry anahtarına bağlar (06 §7.3)"]

# 06 §6: kurumlar birbirini import etmez; çekirdek kurumlara bağımlı değildir.
[tool.importlinter]
root_package = "eworks_integration"

[[tool.importlinter.contracts]]
name = "Kurumlar birbirinden bağımsız"
type = "independence"
modules = ["eworks_integration.institutions.gib", "eworks_integration.institutions.sgk"]

[[tool.importlinter.contracts]]
name = "Çekirdek kurumlara bağımlı değil"
type = "forbidden"
source_modules = ["eworks_integration.core"]
forbidden_modules = ["eworks_integration.institutions"]
