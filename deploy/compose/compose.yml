# Eworks — Docker Compose yığını (04: Compose veya Kubernetes, aynı imajlar).
# Kullanım (depo kökünden): node tools/deploy/yigin.mjs up   — sırları üretir, imajları derler, yığını ayağa kaldırır.
# Sırlar deploy/compose/.env'dedir (gitignore); şablon .env.example. Dışarı yalnız web portu açılır (WEB_PORT).
name: eworks

x-node: &node
  build:
    context: ../..
    dockerfile: deploy/docker/node.Dockerfile
    target: worker
  image: eworks/worker:local
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-shard-db: &shard-db
  image: supabase/postgres:17.6.1.021
  restart: unless-stopped
  environment:
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  healthcheck:
    test: [CMD, pg_isready, -U, postgres, -h, localhost]
    interval: 5s
    retries: 30
  deploy:
    resources:
      limits: { memory: 768m }

services:
  # Kontrol düzlemi: GoTrue (kimlik) + dizin (shard eşlemesi, VKN tekilliği)
  db-control:
    <<: *shard-db
    volumes:
      - db-control:/var/lib/postgresql/data
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro

  auth:
    image: supabase/gotrue:v2.180.0
    restart: unless-stopped
    depends_on:
      db-control: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: http://auth:9999
      GOTRUE_SITE_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db-control:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Kendi kendine kayıt kapalı (D27): hesaplar satış portalından / hesap açma komutuyla açılır
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: '150'
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:9999/health]
      interval: 5s
      retries: 30

  # Kiracı shard'ları (16 mantıksal / 2 fiziksel önerisinin geliştirme karşılığı: 2 shard)
  db-shard-01:
    <<: *shard-db
    volumes: [db-shard-01:/var/lib/postgresql/data]

  db-shard-02:
    <<: *shard-db
    volumes: [db-shard-02:/var/lib/postgresql/data]

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command: [redis-server, --requirepass, '${REDIS_PASSWORD:?}', --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:4.1.4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: eworks
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      retries: 30

  # Nesne deposu (S3 uyumlu): MinIO topluluk imajları yayından kalktığı için SeaweedFS (D35)
  s3:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: [server, -ip.bind=0.0.0.0, -dir=/data, -s3, -s3.config=/etc/seaweedfs/s3.json, -volume.max=0, -master.volumeSizeLimitMB=256]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"eworks","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/seaweedfs/s3.json
        exec /entrypoint.sh "$$@"
      - --
    volumes: [s3:/data]
    healthcheck:
      test: [CMD-SHELL, 'wget -qS -O /dev/null http://localhost:8333/healthz 2>&1 | grep -q "HTTP/1.1 200"']
      interval: 5s
      retries: 30

  # Tek seferlik görevler (profil: gorev) — yigin.mjs altyapıdan sonra `run --rm` ile çalıştırır
  migrate:
    <<: *node
    profiles: [gorev]
    restart: 'no'
    command: [node, apps/worker/src/migrate.ts]
    depends_on:
      db-control: { condition: service_healthy }
      db-shard-01: { condition: service_healthy }
      db-shard-02: { condition: service_healthy }
      auth: { condition: service_healthy }
    environment:
      MIGRATE_CONTROL_URL: postgres://postgres:${POSTGRES_PASSWORD}@db-control:5432/postgres
      MIGRATE_SHARD_URLS: shard-01=postgres://postgres:${POSTGRES_PASSWORD}@db-shard-01:5432/postgres,shard-02=postgres://postgres:${POSTGRES_PASSWORD}@db-shard-02:5432/postgres
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?}
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?}

  # Demo hesabı (profil: gorev): yigin.mjs up demo profilinde çalıştırır; tekrar çalıştırılabilir
  hesap-ac:
    <<: *node
    profiles: [gorev]
    restart: 'no'
    command: [node, apps/worker/src/hesap-ac.ts, demo]
    environment:
      CONTROL_DATABASE_URL: postgres://eworks_control:${CONTROL_DB_PASSWORD}@db-control:5432/postgres
      SHARD_DATABASE_URLS: shard-01=postgres://eworks_worker:${WORKER_DB_PASSWORD}@db-shard-01:5432/postgres,shard-02=postgres://eworks_worker:${WORKER_DB_PASSWORD}@db-shard-02:5432/postgres
      AUTH_URL: http://auth:9999
      JWT_SECRET: ${JWT_SECRET}
      DEMO_OFIS: ${DEMO_OFIS:-Demo Mali Müşavirlik}
      DEMO_EPOSTA: ${DEMO_EPOSTA:-demo@eworks.test}
      DEMO_SIFRE: ${DEMO_SIFRE:?}
      DEMO_AD: ${DEMO_AD:-Demo Müşavir}

  # Arka plan işçisi: outbox → RabbitMQ, entegrasyon sonucunu alan bağlamlarına uygular, takılı işleri kapatır
  worker:
    <<: *node
    depends_on:
      db-shard-01: { condition: service_healthy }
      db-shard-02: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      s3: { condition: service_healthy }
    environment:
      CONTROL_DATABASE_URL: postgres://eworks_control:${CONTROL_DB_PASSWORD}@db-control:5432/postgres
      SHARD_DATABASE_URLS: shard-01=postgres://eworks_worker:${WORKER_DB_PASSWORD}@db-shard-01:5432/postgres,shard-02=postgres://eworks_worker:${WORKER_DB_PASSWORD}@db-shard-02:5432/postgres
      RABBITMQ_URL: amqp://eworks:${RABBITMQ_PASSWORD}@rabbitmq:5672
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      TAX_ID_HMAC_KEY: ${TAX_ID_HMAC_KEY}
    deploy:
      resources:
        limits: { memory: 384m }

  # Kurum entegrasyonu (Python ACL, başsız tarayıcı). Kuruma giden istekler Redis'teki ortak hız sınırından geçer.
  # Demo/test: *.gib.gov.tr istekleri sahte GİB'e gider (GIB_SAHTE_SUNUCU). Üretimde EWORKS_ORTAM=uretim ve
  # GIB_SAHTE_SUNUCU boş verilir; ikisi birlikte verilirse servis açılmaz.
  integration:
    build:
      context: ../..
      dockerfile: deploy/docker/integration.Dockerfile
    image: eworks/integration:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /home/pwuser]
    shm_size: 512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      s3: { condition: service_healthy }
      fake-gib: { condition: service_healthy, required: false }
    environment:
      EWORKS_ORTAM: ${EWORKS_ORTAM:-demo}
      GIB_SAHTE_SUNUCU: ${GIB_SAHTE_SUNUCU-http://fake-gib:8090}
      GIB_ISTEK_DK: ${GIB_ISTEK_DK:-60}
      SHARD_DATABASE_URLS: shard-01=postgres://eworks_integration:${INTEGRATION_DB_PASSWORD}@db-shard-01:5432/postgres,shard-02=postgres://eworks_integration:${INTEGRATION_DB_PASSWORD}@db-shard-02:5432/postgres
      RABBITMQ_URL: amqp://eworks:${RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    deploy:
      resources:
        limits: { memory: 1536m }

  # Sahte GİB (yalnız demo profili): sentetik veri, gerçek GİB ekran akışının taklidi — canlı doğrulama sayılmaz (D33)
  fake-gib:
    image: eworks/integration:local
    profiles: [demo]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: [python3, -m, tests.sahte_kurumlar.gib]
    environment:
      SAHTE_GIB_SIFRE: ${SAHTE_GIB_SIFRE:-demo-gib-sifre}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/dijital/portal/login')"]
      interval: 5s
      retries: 30

  # Portal + BFF (Next.js). Tek açık port; üretimde önünde TLS sonlandıran ters vekil olur (COOKIE_SECURE=true, EWORKS_ORTAM=uretim)
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
      target: web
    image: eworks/web:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports: ['${WEB_PORT:-8080}:3000']
    depends_on:
      auth: { condition: service_healthy }
      redis: { condition: service_healthy }
      db-shard-01: { condition: service_healthy }
      db-shard-02: { condition: service_healthy }
    environment:
      EWORKS_ORTAM: ${EWORKS_ORTAM:-demo}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CONTROL_DATABASE_URL: postgres://eworks_control:${CONTROL_DB_PASSWORD}@db-control:5432/postgres
      SHARD_DATABASE_URLS: shard-01=postgres://eworks_app:${APP_DB_PASSWORD}@db-shard-01:5432/postgres,shard-02=postgres://eworks_app:${APP_DB_PASSWORD}@db-shard-02:5432/postgres
      AUTH_URL: http://auth:9999
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?}
      TAX_ID_HMAC_KEY: ${TAX_ID_HMAC_KEY:?}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/saglik').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 30
    deploy:
      resources:
        limits: { memory: 512m }

volumes:
  db-control:
  db-shard-01:
  db-shard-02:
  redis:
  rabbitmq:
  s3:
