# Compose'daki servislerin Kubernetes karşılığı (04 §1). Veritabanları, Redis, RabbitMQ, S3 ve GoTrue
# küme dışında yönetilen servis ya da ayrı chart olarak varsayılır; adresleri ve sırları bileşen başına `secrets.*` Secret'larından gelir.
image:
  registry: ""
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Bileşen başına önceden oluşturulmuş Secret: her biri yalnız kendi veritabanı rolünü taşır (D34, en az yetki).
# web: eworks_app; worker + migrate: eworks_worker/eworks_control; integration: eworks_integration (yalnız iş ve sır fonksiyonları);
# sales: eworks_sales (kontrol: sales şeması + ofis açma; shard: yalnız hesap açma fonksiyonları) + SALES_TOTP_KEY.
# integration Secret'ında GIB_SAHTE_SUNUCU bulunmaz; EWORKS_ORTAM=uretim. Kurum erişim yolu (D38): GIB_ERISIM_YOLU / SGK_ERISIM_YOLU
# = servis (yoksa varsayılan) | robot; hizmet bazında ERISIM_GIB_EBEYANNAME, ERISIM_GIB_IVD (02 §1b).
secrets:
  web: eworks-web-env
  sales: eworks-sales-env
  worker: eworks-worker-env
  integration: eworks-integration-env
  migrate: eworks-migrate-env

web:
  replicas: 2
  port: 3000
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }

sales:
  replicas: 1
  port: 3000
  resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 384Mi } }

worker:
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }

integration:
  replicas: 2
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1536Mi } }

migrate:
  enabled: true
