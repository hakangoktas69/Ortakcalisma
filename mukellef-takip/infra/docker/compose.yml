# Mükellef Takip — temel yığın. Tek başına kullanılmaz; compose.dev.yml veya compose.prod.yml ile birleştirilir:
#   docker compose -f infra/docker/compose.yml -f infra/docker/compose.dev.yml up -d --build
# Ağlar: edge (caddy, web, api) | app (api, worker, redis, openbao) | data (api, worker, migrate, postgres, backup).
# Yalnız caddy host'a port açar. Sırlar Docker secrets ile dosyadan okunur (scripts/generate-secrets.mjs).
name: mukellef-takip

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-api-env: &api-env
  TZ: Europe/Istanbul
  PORT: "4000"
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  JWT_SECRET_FILE: /run/secrets/jwt_secret
  # Caddy tek atlama: istemci IP'si (hız sınırı) X-Forwarded-For'dan
  TRUST_PROXY_HOPS: "1"

x-api-secrets: &api-secrets [database_url, redis_url, jwt_secret, iyzico_api_key, iyzico_secret_key, whatsapp_access_token, anthropic_api_key]

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.7-alpine
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    networks: [edge]

  web:
    <<: *hardening
    build: { context: ../.., dockerfile: infra/docker/web.Dockerfile }
    image: mukellef-takip/web:local
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    networks: [edge]
    deploy: { resources: { limits: { memory: 512m } } }

  api:
    <<: *hardening
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile, target: runtime }
    image: mukellef-takip/api:local
    environment: *api-env
    secrets: *api-secrets
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [edge, app, data]
    deploy: { resources: { limits: { memory: 768m } } }

  worker:
    <<: *hardening
    image: mukellef-takip/api:local
    command: ["node", "dist/worker.js"]
    environment: *api-env
    secrets: *api-secrets
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      api: { condition: service_started }
    healthcheck: { disable: true }
    networks: [app, data]
    deploy: { resources: { limits: { memory: 768m } } }

  migrate:
    <<: *hardening
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile, target: migrate }
    image: mukellef-takip/migrate:local
    restart: "no"
    environment:
      MIGRATE_DATABASE_URL_FILE: /run/secrets/migrate_database_url
      SEED_DEMO: "false"
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    secrets: [migrate_database_url]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]

  postgres:
    <<: *hardening
    image: postgres:17.11-alpine
    # Giriş betiği veri dizininin sahipliğini ayarlayıp postgres kullanıcısına geçer
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    tmpfs: ["/tmp", "/var/run/postgresql"]
    environment:
      POSTGRES_DB: mukellef
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    secrets: [postgres_password, owner_password, app_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mukellef"]
      interval: 5s
      retries: 20
    networks: [data]
    deploy: { resources: { limits: { memory: 1g } } }

  redis:
    <<: *hardening
    image: redis:7.4.11-alpine
    # Ayrıcalıksız redis kullanıcısı (imajın /data dizininin sahibi); giriş betiği atlandığı için doğrudan
    user: redis
    # Şifre secret dosyasından; kalıcılık açık (BullMQ zamanlanmış işleri)
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes --protected-mode yes"]
    secrets: [redis_password]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20
    networks: [app]

networks:
  edge: {}
  app: { internal: true }
  data: { internal: true }

volumes:
  pgdata:
  redis-data:
  caddy-data:
  caddy-config:

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  owner_password: { file: ./secrets/owner_password }
  app_password: { file: ./secrets/app_password }
  redis_password: { file: ./secrets/redis_password }
  database_url: { file: ./secrets/database_url }
  migrate_database_url: { file: ./secrets/migrate_database_url }
  redis_url: { file: ./secrets/redis_url }
  jwt_secret: { file: ./secrets/jwt_secret }
  iyzico_api_key: { file: ./secrets/iyzico_api_key }
  iyzico_secret_key: { file: ./secrets/iyzico_secret_key }
  whatsapp_access_token: { file: ./secrets/whatsapp_access_token }
  anthropic_api_key: { file: ./secrets/anthropic_api_key }
