# Mükellef Takip (hakan) — tam yığın: PostgreSQL + Redis + API + Web
# Çalıştırma (bu klasörde):  docker compose up --build
# Web: http://localhost:3000   API: http://localhost:4000/api
# Demo giriş: demo@mukellef.test / Demo1234!   (personel: personel@mukellef.test / Personel2026)
name: hakan-mukellef-takip

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mukellef
      POSTGRES_PASSWORD: mukellef_dev
      POSTGRES_DB: mukellef
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mukellef -d mukellef"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  api:
    build:
      context: ../../../hakan/mukellef-takip
      dockerfile: ../../hkazaz/docker/hakan/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://mukellef:mukellef_dev@postgres:5432/mukellef?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000/api
      # Yalnızca yerel demo için üretilmiş anahtarlar
      JWT_SECRET: d31dd31b21ad7d1fb483ba87850b0da3c0e4a42daf121c2049fafc9132bc9690
      VAULT_KEY: Z5xqfiPUqc+QRcxsx3i6SZwfzxBbovlsDviHbQnPa/Q=
      # Tüm dış servisler demo modunda: GİB, SGK, WhatsApp, iyzico, Claude'a bağlanmaz
      SGK_MODE: mock
      GIB_MODE: mock
      WHATSAPP_MODE: mock
      BILLING_PROVIDER: demo
      ASSISTANT_MODE: mock
      TZ: Europe/Istanbul
    volumes:
      - apistate:/state
    ports:
      - "4000:4000"

  web:
    build:
      context: ../../../hakan/mukellef-takip
      dockerfile: ../../hkazaz/docker/hakan/web.Dockerfile
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  apistate:
